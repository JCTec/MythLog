name: CI

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, Test, Package
    # macos-latest's default toolchain is the Swift 6.0 the package builds and
    # formats with. Pinning to a specific image breaks: macos-14 defaults to
    # Swift 5.10 (too old) and macos-15 to Swift 6.1+ (swift-format config schema
    # changed). Do not select the "newest" Xcode for the same reason.
    runs-on: macos-latest
    timeout-minutes: 60

    # Needed by the tag-only release step below. Also covers checkout's read.
    permissions:
      contents: write

    env:
      # Build the unsandboxed Developer ID shape so the uploaded artifact is
      # actually launchable. The App Store shape (App Sandbox + App Group +
      # iCloud container) needs a provisioning profile to authorize those
      # entitlements; CI signs ad-hoc and has no profile, so a sandboxed build
      # here gets SIGKILLed the moment you open it — the artifact would exist
      # but could never be installed.
      #
      # Set at job level, not on the packaging step: verify-release.sh runs
      # package-release.sh internally, and the packaging step below reuses that
      # app via MYTHLOG_SKIP_RELEASE_BUILD=1. Setting it only there would be
      # silently ignored.
      #
      # Trade-off: CI no longer exercises the App Store entitlements. Those are
      # validated when archiving through Xcode and at submission.
      MYTHLOG_DISTRIBUTION: developer-id

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Apple Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install Tools
        run: |
          # The SwiftUI boundary checks in verify-release.sh use ripgrep, which
          # is not guaranteed on the GitHub macOS runner image.
          command -v rg >/dev/null 2>&1 || brew install ripgrep
          rg --version

      # Runs before Verify Release so the version reaches package-release.sh,
      # which verify-release.sh invokes internally — otherwise the app bundle
      # and zip would carry the default version while the DMG carried the tag's.
      - name: Derive version from tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "MYTHLOG_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Building MythLog ${version} from tag ${GITHUB_REF_NAME}"

      - name: Verify Release
        run: ./scripts/verify-release.sh

      # DMG packaging is tag-only. Branch and PR runs still exercise the app
      # bundle, zip, and checksums through verify-release.sh, so packaging
      # regressions are still caught — this only skips wrapping it in a disk
      # image, which nothing needs until there is a version to hand out.
      - name: Package And Audit DMG
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          MYTHLOG_SKIP_RELEASE_BUILD: "1"
          MYTHLOG_DMG_FINDER_LAYOUT: skip
        run: |
          ./scripts/package-dmg.sh
          ./scripts/audit-distribution.sh

      # Publishes a GitHub Release on the tag with the DMG attached. Unlike an
      # Actions artifact this does not expire, but the repository is private, so
      # only people with repo access can download it either way.
      #
      # Always marked --prerelease: the build is ad-hoc signed and unnotarized,
      # so it is a test build, not a distributable one. A release meant for
      # someone else is built, signed with the Developer ID certificate, and
      # notarized locally; see docs/RELEASING.md.
      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body \
            > "$RUNNER_TEMP/notes.md" || true

          {
            echo "> [!WARNING]"
            echo "> **Unsigned test build.** This DMG is ad-hoc signed and not"
            echo "> notarized, so Gatekeeper will refuse to open it. After"
            echo "> dragging the app to Applications, clear the quarantine flag:"
            echo "> \`xattr -dr com.apple.quarantine /Applications/MythLog.app\`"
            echo "> It is also unsandboxed (Developer ID shape), not the App"
            echo "> Store build."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "${GITHUB_REF_NAME}" \
            --title "MythLog ${MYTHLOG_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            "dist/MythLog-${MYTHLOG_VERSION}.dmg" \
            "dist/MythLog-${MYTHLOG_VERSION}.dmg.sha256" \
            "dist/MythLog-${MYTHLOG_VERSION}.zip" \
            "dist/MythLog-${MYTHLOG_VERSION}.zip.sha256"
